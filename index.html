<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="./source/index.css">
  <script type="module" src="./source/index.js" defer></script>
  <link rel="shortcut icon" href="./perfil_padrão.jpg" type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criador de Identidade</title>
</head>
<body>
  <h1 id="TItulo">Criador de identidade</h1>

  <div id="Identidade">
    <input type="text" id="Nome" placeholder="Nome:">
    <input type="text" id="idade" placeholder="Idade:">
    <input type="text" id="Dinheiro" placeholder="Dinheiro">
    <button id="btnCriar">Criar identidade</button>
  </div>

  <dialog id="Caixa">
    <h3 id="Exibir_Nome">Nome: </h3>
    <h3 id="Exibir_Idade">Idade: </h3>
    <h3 id="Exibir_Dinheiro">Dinheiro</h3>
    <button id="btn-fechar">Fechar</button>
  </dialog>
</body>
</html>
